<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <!-- 渐变背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef9f3;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fefcf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9f5f0;stop-opacity:1" />
    </linearGradient>

    <!-- 水墨晕染效果 -->
    <radialGradient id="ink1" cx="30%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#d4c5b0;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#d4c5b0;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="ink2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#a89080;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#a89080;stop-opacity:0" />
    </radialGradient>

    <radialGradient id="ink3" cx="20%" cy="70%" r="30%">
      <stop offset="0%" style="stop-color:#c8b8a8;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#c8b8a8;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- 水墨晕染层 -->
  <ellipse cx="360" cy="240" rx="480" ry="320" fill="url(#ink1)"/>
  <ellipse cx="840" cy="480" rx="420" ry="280" fill="url(#ink2)"/>
  <ellipse cx="240" cy="560" rx="360" ry="240" fill="url(#ink3)"/>

  <!-- 远山剪影 -->
  <path d="M0 700 Q150 650 300 680 T600 660 T900 690 T1200 670 L1200 800 L0 800 Z"
        fill="#b8a898" opacity="0.04"/>

  <path d="M0 720 Q200 680 400 710 T800 690 T1200 710 L1200 800 L0 800 Z"
        fill="#a08878" opacity="0.03"/>

  <!-- 竹影 -->
  <g opacity="0.02" fill="#4a3a2a">
    <path d="M100 800 L105 400 Q108 380 100 360 L95 360 Q88 380 95 400 Z"/>
    <path d="M115 800 L118 450 Q120 430 115 410 L112 410 Q107 430 110 450 Z"/>

    <path d="M1080 800 L1085 350 Q1088 330 1080 310 L1075 310 Q1068 330 1075 350 Z"/>
    <path d="M1095 800 L1098 400 Q1100 380 1095 360 L1092 360 Q1087 380 1090 400 Z"/>
  </g>

  <!-- 梅花点缀 -->
  <g opacity="0.03">
    <circle cx="200" cy="200" r="6" fill="#d4a5a5"/>
    <circle cx="190" cy="220" r="4" fill="#d4a5a5"/>
    <circle cx="210" cy="215" r="5" fill="#d4a5a5"/>

    <circle cx="950" cy="150" r="5" fill="#d4a5a5"/>
    <circle cx="965" cy="165" r="6" fill="#d4a5a5"/>
    <circle cx="940" cy="170" r="4" fill="#d4a5a5"/>

    <circle cx="600" cy="650" r="5" fill="#d4a5a5"/>
    <circle cx="615" cy="640" r="4" fill="#d4a5a5"/>
    <circle cx="590" cy="660" r="6" fill="#d4a5a5"/>
  </g>

  <!-- 飞鸟剪影 -->
  <g opacity="0.02" fill="#3a3a3a">
    <path d="M500 150 Q510 145 520 150 Q510 148 500 150"/>
    <path d="M520 160 Q530 155 540 160 Q530 158 520 160"/>
    <path d="M800 200 Q810 195 820 200 Q810 198 800 200"/>
  </g>

  <!-- 云雾 -->
  <ellipse cx="300" cy="100" rx="200" ry="50" fill="#ffffff" opacity="0.15"/>
  <ellipse cx="900" cy="120" rx="180" ry="45" fill="#ffffff" opacity="0.12"/>
</svg>